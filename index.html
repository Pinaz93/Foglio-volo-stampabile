<style>:root{--bg:#e9edf2;--fg:#12161c;--mut:#5b6472;--btn:#0b3a8f;--btnfg:#fff;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

</style>

<body>
<header class="top"><h1>Flight sheet</h1><p>LIDO OFP to yoke sheet and thermal strip</p></header>
<main class="panel">
 <label class="pick drop"><input id="file" type="file" accept="application/pdf" multiple><span class="ic">+</span><span class="dt"><b>Load LIDO PDFs</b><small>Select all of the day's OFPs at once</small></span></label>
 <details class="opts card"><summary>Options</summary><div id="optbox"></div></details>
 <button id="gmBtn" type="button" class="alt gm">Fetch OFPs from Gmail<small>needs a one-time setup in Options</small></button>
 <div id="edit"></div>
 <div class="acts">
  <button id="print" type="button" disabled>Download A4 PDF<small>2 days per sheet</small></button>
  <button id="thermalBtn" type="button" class="alt" disabled>Thermal strip<small>one image, all flights</small></button>
 </div>
 <button id="clearBtn" type="button" class="clr" hidden>Clear saved flights</button>
 <div id="msg" class="card">Load one or more LIDO PDFs (all 4 flights at once is fine). Each day becomes half an A4 page with one column per flight: two days per sheet.</div>
</main>
<div id="th" style="max-width:210mm;margin:0 auto;padding:0 16px"></div>
<div id="out"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const v=x=>x==null||x===''?'—':esc(x);
const hm=t=>t?t.slice(0,2)+':'+t.slice(2):'—';
const mins=t=>t?(+t.slice(0,2))*60+(+t.slice(2)):0;

async function readPdf(file){
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  let out='';
  for(let p=1;p<=Math.min(pdf.numPages,120);p++){
    const c=await (await pdf.getPage(p)).getTextContent();
    const rows=[];
    [...c.items].filter(i=>i.str!==undefined).sort((a,b)=>b.transform[5]-a.transform[5]).forEach(i=>{
      const r=rows[rows.length-1];
      if(r&&Math.abs(r.y-i.transform[5])<=2.5)r.it.push(i);else rows.push({y:i.transform[5],it:[i]});
    });
    rows.forEach(r=>{out+=r.it.sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ')+'\n'});
  }
  return out;
}

/*WX*/
const WXDEF={okCeil:1000,okVis:5000,badCeil:400,badVis:1350,wMean:20,wGust:0};
const WXMON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
function parseWx(T){
  const out={},L=T.split('\n').map(s=>s.trim());
  const i=L.findIndex(l=>/^DESTINATION ALTERNATE:/.test(l));
  if(i<0)return out;
  let cur=null,mode=null;
  for(let k=i+1;k<L.length;k++){
    const l=L[k];
    if(/^(ENROUTE AIRPORT|Space Weather|AIRPORTLIST|TAKE-?OFF ALTERNATE|DEPARTURE AIRPORT|DESTINATION AIRPORT|FUEL ENROUTE|ADEQUATE ENROUTE)/i.test(l))break;
    if(!l||/^Page \d+ of \d+/.test(l)||/^(FR|DLA) \d+\/\S+\/.*OFP:\d+/.test(l))continue;
    const m=l.match(/^([A-Z]{4})\/([A-Z]{3})\b/);
    if(m){cur=out[m[1]]={sa:'',ft:''};mode=null;continue}
    if(!cur)continue;
    if(/^SA\b/.test(l)){mode='sa';cur.sa=l.replace(/^SA\s*/,'');continue}
    if(/^FT\b/.test(l)){mode='ft';cur.ft=l.replace(/^FT\s*/,'');continue}
    if(mode==='ft'&&!/=\s*$/.test(cur.ft))cur.ft+=' '+l;
    else if(mode==='sa'&&!/=\s*$/.test(cur.sa))cur.sa+=' '+l;
  }
  return out;
}
function wxDate(ref,dd,hh,mm){
  let best=null;
  for(const o of [-1,0,1]){const t=Date.UTC(ref.getUTCFullYear(),ref.getUTCMonth()+o,dd,hh,mm||0);
    if(best===null||Math.abs(t-ref.getTime())<Math.abs(best-ref.getTime()))best=t}
  return best;
}
function wxEl(tk){
  const e={};
  for(const w of tk){
    let m;
    if(w==='CAVOK'){e.cav=true;e.vis=9999;e.ceil=Infinity;e.ts=false;e.cb=false;e.tcu=false;e.cloud=true;e.wx=true;continue}
    if(m=w.match(/^(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?(KT|MPS)$/)){const k=m[4]==='MPS'?1.944:1;e.spd=Math.round(+m[2]*k);e.gust=m[3]?Math.round(+m[3]*k):0;continue}
    if(/^\d{4}$/.test(w)){e.vis=+w;continue}
    if(m=w.match(/^(FEW|SCT|BKN|OVC)(\d{3}|\/\/\/)(CB|TCU)?$/)){
      if(!e.cloud){e.cloud=true;e.ceil=Infinity;e.cb=false;e.tcu=false}
      if(m[3]==='CB')e.cb=true; if(m[3]==='TCU')e.tcu=true;
      if((m[1]==='BKN'||m[1]==='OVC')&&m[2]!=='///')e.ceil=Math.min(e.ceil,+m[2]*100);
      continue}
    if(m=w.match(/^VV(\d{3}|\/\/\/)$/)){if(!e.cloud){e.cloud=true;e.ceil=Infinity;e.cb=false;e.tcu=false}e.ceil=Math.min(e.ceil,m[1]==='///'?0:+m[1]*100);continue}
    if(/^(NSC|NCD|SKC|CLR)$/.test(w)){e.cloud=true;e.ceil=Infinity;e.cb=false;e.tcu=false;continue}
    if(w==='NSW'){e.wx=true;e.ts=false;e.sh=false;e.persist=false;continue}
    if(/^[-+]?([A-Z]{2})+$/.test(w)){
      const c=w.replace(/^[-+]/,'').match(/.{2}/g)||[];
      const known=['TS','SH','RA','DZ','SN','SG','PL','GR','GS','UP','BR','FG','FU','VA','DU','SA','HZ','PY','PO','SQ','FC','SS','DS','VC','MI','BC','PR','DR','BL','FZ'];
      if(!c.every(x=>known.includes(x)))continue;
      if(!e.wx){e.wx=true;e.ts=false;e.sh=false;e.persist=false}
      if(c.includes('TS'))e.ts=true;
      if(c.includes('SH'))e.sh=true;
      if(c.some(x=>['BR','FG','HZ','FU','DU','SA','VA','SS','DS','FC'].includes(x)))e.persist=true;
      if(!c.includes('SH')&&!c.includes('TS')&&c.some(x=>['RA','DZ','SN','SG','PL'].includes(x)))e.persist=true;
    }
  }
  return e;
}
function wxMerge(a,e,full){
  const s=full?{spd:0,gust:0,vis:9999,ceil:Infinity,ts:false,cb:false,tcu:false}:Object.assign({},a);
  if(e.spd!==undefined){s.spd=e.spd;s.gust=e.gust}
  if(e.vis!==undefined)s.vis=e.vis;
  if(e.ceil!==undefined)s.ceil=e.ceil;
  if(e.cloud){s.cb=!!e.cb;s.tcu=!!e.tcu}
  if(e.wx)s.ts=!!e.ts;
  return s;
}
const wxWorst=(a,b)=>({spd:Math.max(a.spd,b.spd),gust:Math.max(a.gust,b.gust),vis:Math.min(a.vis,b.vis),ceil:Math.min(a.ceil,b.ceil),ts:a.ts||b.ts,cb:a.cb||b.cb,tcu:a.tcu||b.tcu});
function tafBuild(ft,ref){
  const tk=ft.replace(/=/g,' ').trim().split(/\s+/).filter(Boolean);
  let i=0;
  if(/^(TAF|AMD|COR)$/.test(tk[i]))i++;
  if(/^\d{6}$/.test(tk[i]))i++;
  const v=tk[i]&&tk[i].match(/^(\d{2})(\d{2})\/(\d{2})(\d{2})$/);
  if(!v)return null;
  i++;
  const vf=wxDate(ref,+v[1],+v[2]),vt=wxDate(ref,+v[3],+v[4]);
  const G=[];let cur={t:'BASE',tk:[]};G.push(cur);
  for(;i<tk.length;i++){
    const w=tk[i];let m;
    if(w==='BECMG'||w==='TEMPO'||/^PROB\d{2}$/.test(w)){
      let t=w==='BECMG'?'BECMG':w==='TEMPO'?'TEMPO':'PROB';
      if(t==='PROB'&&tk[i+1]==='TEMPO'){t='PROBTEMPO';i++}
      cur={t,tk:[]};G.push(cur);
      const p=tk[i+1]&&tk[i+1].match(/^(\d{2})(\d{2})\/(\d{2})(\d{2})$/);
      if(p){cur.from=wxDate(ref,+p[1],+p[2]);cur.to=wxDate(ref,+p[3],+p[4]);i++}
      continue}
    if(m=w.match(/^FM(\d{2})(\d{2})(\d{2})$/)){cur={t:'FM',tk:[],from:wxDate(ref,+m[1],+m[2],+m[3])};G.push(cur);continue}
    cur.tk.push(w);
  }
  const seg=[],ov=[];
  let st=wxMerge(null,wxEl(G[0].tk),true),from=vf;
  for(const g of G.slice(1)){
    const e=wxEl(g.tk);
    if(g.t==='FM'){seg.push({from,to:g.from,s:st});st=wxMerge(null,e,true);from=g.from}
    else if(g.t==='BECMG'&&g.from!=null){
      const ns=wxMerge(st,e,false);
      seg.push({from,to:g.from,s:st});seg.push({from:g.from,to:g.to,s:wxWorst(st,ns)});
      st=ns;from=g.to}
    else if(g.from!=null){ov.push({t:g.t,from:g.from,to:g.to,e,s:wxMerge(st,e,false)})}
  }
  seg.push({from,to:vt,s:st});
  return {vf,vt,seg,ov};
}
function wxEta(d,a){
  const m=(d.date||'').match(/^(\d{2})([A-Z]{3})(\d{4})$/);
  if(!m||!d.ldg||!d.ldg.z||!a.time)return null;
  let t=Date.UTC(+m[3],WXMON.indexOf(m[2]),+m[1])+(+d.ldg.z.slice(0,2)*60+ +d.ldg.z.slice(2))*60000;
  if(d.off&&d.off.z&&d.ldg.z<d.off.z)t+=864e5;
  return t+(+a.time.slice(0,2)*60+ +a.time.slice(2))*60000;
}
function wxAlt(d,a){
  try{
    const W=(typeof WXT!=='undefined')?WXT:WXDEF;
    const raw=d.wxRaw&&d.wxRaw[a.icao];
    if(!raw||!/\d{4}\/\d{4}/.test(raw.ft||''))return {s:'na',r:'no TAF'};
    const eta=wxEta(d,a);if(eta==null)return {s:'na',r:'no ETA'};
    const TF=tafBuild(raw.ft,new Date(eta));if(!TF)return {s:'na',r:'TAF unreadable'};
    const w0=eta-36e5,w1=eta+36e5;
    if(w1<=TF.vf||w0>=TF.vt)return {s:'na',r:'outside TAF'};
    let vis=9999,ceil=Infinity,spd=0,gust=0,ts=false,cb=false,tsMaybe=false,tsTxt='';
    const hh=t=>new Date(t).toISOString().slice(11,13)+'Z';
    for(const x of TF.seg){if(x.to>w0&&x.from<w1){vis=Math.min(vis,x.s.vis);ceil=Math.min(ceil,x.s.ceil);spd=Math.max(spd,x.s.spd);gust=Math.max(gust,x.s.gust);ts=ts||x.s.ts;cb=cb||x.s.cb||x.s.tcu}}
    for(const o of TF.ov){
      if(!(o.to>w0&&o.from<w1))continue;
      const e=o.e,transient=!!(e.ts||e.sh)&&!e.persist;
      if(e.ts||e.cb){tsMaybe=true;tsTxt=o.t==='TEMPO'?'TS TEMPO':'TS PROB'}
      if(o.t!=='PROBTEMPO'&&!transient){if(e.vis!==undefined)vis=Math.min(vis,e.vis);if(e.ceil!==undefined)ceil=Math.min(ceil,e.ceil)}
      if(e.spd!==undefined){spd=Math.max(spd,e.spd);gust=Math.max(gust,e.gust)}
    }
    const bad=[],warn=[];
    if(ceil<W.badCeil)bad.push('ceil '+ceil);else if(ceil<W.okCeil)warn.push('ceil '+ceil);
    if(vis<W.badVis)bad.push('vis '+vis);else if(vis<W.okVis)warn.push('vis '+vis);
    if(ts)bad.push('TS');else if(cb)warn.push('CB');
    if(tsMaybe&&!ts)warn.push(tsTxt);
    if(spd>=W.wMean||(gust>0&&gust>=W.wGust))warn.push('wind '+spd+(gust?'G'+gust:''));
    if(bad.length)return {s:'bad',r:bad.concat(warn).slice(0,3).join(', ')};
    if(warn.length)return {s:'warn',r:warn.slice(0,3).join(', ')};
    return {s:'ok',r:''};
  }catch(err){return {s:'na',r:'error'}}
}
/*ENDWX*/


/*DLA*/

  if(h){d.fn=h[1].replace(/\s/g,'');d.date=h[2];d.dep=h[3];d.arr=h[4];d.type=h[5];d.reg=h[6]}
  const c=T.match(/C\/S\s+(\w+)\s+(\w{4})\/(\w{3})\s+(\w{4})\/(\w{3})/);
  if(c){d.cs=c[1];d.depI=c[3];d.arrI=c[5];d.dep=d.dep||c[2];d.arr=d.arr||c[4]}
  d.ci=m(/CI\s+(\d+)/);d.ofp=m(/OFP:(\d+\/\d+\/\d+)/);
  {const fsm=T.match(/\b[A-Z]{4}\/(0\d{3}\/(?:[A-Z0-9_]+\/)*[A-Z0-9_]*)/);
    if(fsm){const lv=[];for(const t of fsm[1].split('/')){if(t==='T_O_D')break;if(/^0\d{3}$/.test(t)&&+t>=200)lv.push(+t)}
      if(lv.length){const mx=Math.max(...lv);d.fl=lv[0]===mx?String(lv[0]):lv[0]+'>'+mx}}}
  d.fl=d.fl||m(/N\d{4}F(\d{3})/);
  if(d.dep&&d.arr){
    const r=T.match(new RegExp(d.dep+'/(\\d{2}[LRC]?)\\s+([\\s\\S]*?)\\s+'+d.arr+'/(\\d{2}[LRC]?)'));
    if(r){
      d.rwyD=r[1];d.rwyA=r[3];

  const w=k=>{const r=T.match(new RegExp(k+'\\s+TOW\\s+([\\d.]+)\\s+LW\\s+([\\d.]+)\\s+ZFW\\s+([\\d.]+)'));return r?{tow:+r[1],lw:+r[2],zfw:+r[3]}:null};

const wt=(k,e,mx)=>`<div class="row" data-k="wts"><span>${k}</span><b class="${e&&mx&&e>mx?'warn':''}">${e?e.toFixed(1):'—'} <em>(${mx?mx.toFixed(1):'—'})</em></b></div>`;
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

function render(list){
  const g={};list.forEach(d=>(g[d.date]=g[d.date]||[]).push(d));
  const strips=[];
  Object.keys(g).sort((a,b)=>dkey(a).localeCompare(dkey(b))).forEach(k=>{
    const L=g[k].sort((a,b)=>((a.off&&a.off.z)||'').localeCompare((b.off&&b.off.z)||''));
    for(let i=0;i<L.length;i+=4)strips.push([0,1,2,3].map(j=>col(L[i+j],i+j+1)).join(''));
  });
  let h='';
  for(let i=0;i<strips.length;i+=2)h+=`<div class="page"><div class="strip">${strips[i]}</div>${strips[i+1]?`<div class="strip">${strips[i+1]}</div>`:''}</div>`;
  return h;
}

var LAST=[];
function wxMark(x,mx,cy,st,S){
  x.save();x.strokeStyle='#000';x.fillStyle='#000';x.lineWidth=3.2*S;x.lineCap='round';x.lineJoin='round';
  if(st==='ok'){x.beginPath();x.moveTo(mx*S,cy*S);x.lineTo((mx+5)*S,(cy+6)*S);x.lineTo((mx+16)*S,(cy-9)*S);x.stroke()}
  else if(st==='bad'){x.beginPath();x.moveTo(mx*S,(cy-8)*S);x.lineTo((mx+14)*S,(cy+6)*S);x.moveTo((mx+14)*S,(cy-8)*S);x.lineTo(mx*S,(cy+6)*S);x.stroke()}
  else{x.font=`700 ${28*S}px "Barlow Condensed","Arial Narrow",sans-serif`;x.textBaseline='middle';x.fillText(st==='warn'?'!':'?',mx*S,cy*S)}
  x.restore();
}
function strip(d,n){
  const S=4,W=280,M=6,IW=W-2*M,F='"Barlow Condensed","Arial Narrow",sans-serif',O=k=>on('th',k);
  const c=document.createElement('canvas');c.width=W*S;c.height=1800*S;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#000';x.strokeStyle='#000';x.textBaseline='top';
  const font=(s,b)=>`${b?700:500} ${s*S}px ${F}`;
  const tw=(t,s,b)=>{x.font=font(s,b);return x.measureText(t).width/S};
  const fit=(t,s,b,mw=IW)=>{while(tw(t,s,b)>mw&&s>8)s--;return s};
  const T=(t,s,b,al='l',adv=true)=>{s=fit(t,s,b);const w=tw(t,s,b);x.font=font(s,b);x.fillText(t,(al==='l'?M:al==='r'?W-M-w:(W-w)/2)*S,y*S);if(adv)y+=s*1.1;return s};
  const rule=(th=2,g=4)=>{y+=g;x.fillRect(M*S,y*S,IW*S,th*S);y+=th+g};
  const R=(k,val,s=22)=>{x.font=font(s-3,false);x.fillText(k,M*S,(y+2)*S);const w=tw(val,s,true);x.font=font(s,true);x.fillText(val,(W-M-w)*S,y*S);y+=s*1.15};
  const g=v=>v==null||v===''?'-':String(v);
  let y=12;
  const dt=d.date?d.date.slice(0,2)+' '+d.date.slice(2,5):'-';
  T(n+'°',28,true,'l',false);T(g(d.fn),20,true,'c',false);T(dt,18,true,'r');y+=2;
  rule(3,5);
  T(g(d.cs),88,true,'c');T(g(d.dep)+' → '+g(d.arr),38,true,'c');
  T(g(d.depI)+' → '+g(d.arrI)+'  FL'+g(d.fl),17,false,'c');
  if(O('flt'))R('Flight time',d.fltT?hm(d.fltT):'-');
  if(O('times')){rule();[['Off',d.off],['T/O',d.air],['Ldg',d.ldg],['On',d.on]].forEach(([k,o])=>R(k,tz(o)||'-'))}
  if(O('procs')){rule();R(g(d.dep)+' RWY',g(d.rwyD));T(g(d.sid),40,true);R(g(d.arr)+' RWY',g(d.rwyA));T(g(d.star),40,true)}
  if(O('fuel')){
    rule();
    const y0=y+2,h=60;x.lineWidth=3*S;x.strokeRect(M*S,y0*S,IW*S,h*S);
    x.font=font(18,true);x.fillText('Block',(M+6)*S,(y0+6)*S);x.fillText('min',(M+6)*S,(y0+26)*S);if(bkc(d)){x.font=font(13,true);x.fillText('calc',(M+6)*S,(y0+46)*S)}
    const b=g(bk(d)),bs=fit(b,64,true,IW-76);x.font=font(bs,true);x.fillText(b,(W-M-6-tw(b,bs,true))*S,(y0+(h-bs)/2)*S);y=y0+h+8;
    R('Taxi',g(d.taxi));R('Trip',g(d.trip));
  }
  if(O('alts')){
    rule();T('ALTERNATES (kg)',16,true);
    const al=d.alts||[];
    al.forEach((a,i)=>{
      const y0=y,lab=a.icao+(i?'':' ★');
      R(lab,String(a.fuel)+(i?'  '+(a.fuel-al[0].fuel>=0?'+':'')+(a.fuel-al[0].fuel):''));
      if(O('wx')&&a.wx){
        wxMark(x,M+tw(lab,19,false)+8,y0+14,a.wx.s,S);
        if((a.wx.s==='warn'||a.wx.s==='bad')&&a.wx.r)T(a.wx.r,15,false);
      }
    });
    if(WXON&&O('wx')&&d.wxTime)T('wx as of '+d.wxTime+'Z',13,false,'r');
  }
  if(O('wts')){
    rule();T('WEIGHTS t (max)',16,true);
    const e=d.est||{},m=d.max||{};
    [['TOW','tow'],['LW','lw'],['ZFW','zfw']].forEach(([k,f])=>R(k,e[f]!=null&&m[f]!=null?e[f].toFixed(1)+' ('+m[f].toFixed(1)+')':'-'));
  }
  if(O('pax')){y+=10;x.font=font(18,false);x.fillText('Pax',M*S,y*S);x.fillRect((M+36)*S,(y+22)*S,(IW-36)*S,2*S);if(d.pax){x.font=font(26,true);x.fillText(String(d.pax),(M+44)*S,(y-2)*S)}y+=32}
  if(O('notes')){rule();T('OFP '+g(d.ofp),15,false,'c')}
  y+=10;
  for(let i=M;i<W-M;i+=14)x.fillRect(i*S,y*S,7*S,1.5*S);
  y+=14;
  const H=Math.ceil(y),o=document.createElement('canvas');o.width=W;o.height=H;
  const ox=o.getContext('2d');ox.imageSmoothingQuality='high';ox.drawImage(c,0,0,W*S,H*S,0,0,W,H);
  const id=ox.getImageData(0,0,W,H),p=id.data;
  for(let i=0;i<p.length;i+=4){const k=p[i]<150?0:255;p[i]=p[i+1]=p[i+2]=k;p[i+3]=255}
  ox.putImageData(id,0,0);return o;
}
async function thermal(){
  if(!LAST.length){$('msg').textContent='Load the LIDO PDFs first.';return}
  try{await document.fonts.load('700 20px "Barlow Condensed"');await document.fonts.load('500 20px "Barlow Condensed"')}catch(e){}
  const box=$('th');box.innerHTML='';
  const L=[...LAST].sort((a,b)=>(dkey(a.date)+((a.off&&a.off.z)||'')).localeCompare(dkey(b.date)+((b.off&&b.off.z)||'')));
  const cnt={};
  const cs=L.map(d=>{cnt[d.date]=(cnt[d.date]||0)+1;return strip(d,cnt[d.date])});
  const big=document.createElement('canvas');big.width=280;big.height=cs.reduce((s,c)=>s+c.height,0);
  const bx=big.getContext('2d');bx.fillStyle='#fff';bx.fillRect(0,0,big.width,big.height);
  let yy=0;cs.forEach(c=>{bx.drawImage(c,0,yy);yy+=c.height});
  const blob=await new Promise(r=>big.toBlob(r,'image/png'));
  const url=URL.createObjectURL(blob),name='thermal-strip.png';
  const w=document.createElement('div');
  w.innerHTML=`<p><b>${cs.length} flights</b> in one image · about ${Math.round(big.height/8)} mm of paper</p><img src="${url}" alt="Thermal strip" style="width:280px;background:#fff;border:1px solid #888;display:block;margin:6px 0 10px">`;
  const sh=document.createElement('button');sh.textContent='Share';
  sh.onclick=async()=>{const f=new File([blob],name,{type:'image/png'});try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else throw 0}catch(err){await saveFile(blob,name)}};
  w.appendChild(sh);box.appendChild(w);
  box.scrollIntoView();
}

async function saveFile(blob,name){
  const url=URL.createObjectURL(blob);
  const type=blob.type||(name.endsWith('.pdf')?'application/pdf':'image/png');
  const file=new File([blob],name,{type});
  try{const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}
  const m=$('msg');
  m.innerHTML='<b>File ready:</b> '+esc(name)+' · <a href="'+url+'" download="'+esc(name)+'" style="color:inherit">Download again</a>';
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    const b=document.createElement('button');b.textContent='Share / Save to Files';b.style.marginLeft='8px';
    b.onclick=async()=>{try{await navigator.share({files:[file]})}catch(e){}};
    m.appendChild(b);
  }
}
function wxDraw(doc,x,y,st){
  const cy=y-.8;
  doc.setDrawColor(0);doc.setTextColor(0);doc.setLineWidth(.5);
  if(st==='ok'){doc.line(x,cy,x+.9,cy+1);doc.line(x+.9,cy+1,x+2.6,cy-1.6)}
  else if(st==='bad'){doc.line(x,cy-1.1,x+2.3,cy+1.1);doc.line(x,cy+1.1,x+2.3,cy-1.1)}
  else{doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text(st==='warn'?'!':'?',x,y+.2)}
}
function pdfCol(doc,x,top,w,d,n){
  if(!d)return;
  const O=k=>on('a4',k),sh0=148.5;
  const pg=v=>v==null||v===''?'-':String(v);
  const p=2.5,L=x+p,R=x+w-p,C=(L+R)/2;let y=top+p;
  const t=(s,xx,yy,sz,b,al)=>{doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(sz);doc.text(String(s),xx,yy,{align:al||'left'})};
  const fitT=(s,xx,yy,sz,b,al)=>{doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(sz);while(doc.getTextWidth(String(s))>R-L&&sz>6){sz-=.5;doc.setFontSize(sz)}doc.text(String(s),xx,yy,{align:al||'left'})};
  const gray=g=>doc.setTextColor(g);
  const ln=(x1,x2,yy,lw)=>{doc.setLineWidth(lw);doc.line(x1,yy,x2,yy)};
  const row=(k,val)=>{y+=3.2;gray(80);t(k,L,y,7.8,false);gray(0);t(val,R,y,8.2,true,'right')};
  const sec=s=>{y+=1.6;ln(L,R,y,.18);y+=2.7;t(s,L,y,7.5,true)};
  y+=5;t(n+'°',L,y,15,true);t(pg(d.fn),C,y,8,true,'center');t(d.date?d.date.slice(0,2)+' '+d.date.slice(2,5):'-',R,y,8,true,'right');
  y+=1.5;ln(L,R,y,.35);
  y+=10;fitT(pg(d.cs),C,y,25,true,'center');
  y+=6.5;fitT(pg(d.dep)+' > '+pg(d.arr),C,y,13,true,'center');
  y+=3.6;fitT(pg(d.depI)+' > '+pg(d.arrI)+'  FL'+pg(d.fl)+'  '+pg(d.reg),C,y,7,false,'center');
  if(O('times')||O('flt')){
    sec('TIMES');
    if(O('times'))[['Off',d.off],['T/O',d.air],['Ldg',d.ldg],['On',d.on]].forEach(([k,o])=>row(k,tz(o)||'-'));
    if(O('flt'))row('Flight time',d.fltT?hm(d.fltT):'-');
  }
  if(O('procs')){
    sec('PROCEDURES');
    row(pg(d.dep)+' RWY',pg(d.rwyD));y+=4.6;fitT(pg(d.sid),L,y,13.5,true);
    row(pg(d.arr)+' RWY',pg(d.rwyA));y+=4.6;fitT(pg(d.star),L,y,13.5,true);
  }
  if(O('fuel')||O('blockact')){
    sec('FUEL (kg)');
    if(O('fuel')){y+=8.5;doc.setLineWidth(.35);doc.rect(L,y-7.5,R-L,9);
      t(bkl(d),L+1.5,y-2,7,true);t(pg(bk(d)),R-1.5,y,21,true,'right');y+=1}
    if(O('blockact')){y+=3.2;gray(80);t('Block act.',L,y,7.8,false);gray(0);ln(L+17,R,y+.5,.2)}
    if(O('fuel')){row('Taxi',pg(d.taxi));row('Trip',pg(d.trip))}
  }
  if(O('alts')){
    sec('ALTERNATES (fuel, diff.)');
    if(WXON&&O('wx')&&d.wxTime){gray(90);t('wx '+d.wxTime+'Z',R,y,6,false,'right');gray(0)}
    const al=d.alts||[];
    al.forEach((a,i)=>{
      const lab=a.icao+(i?'':' *');
      row(lab,a.fuel+(i?'  '+(a.fuel-al[0].fuel>=0?'+':'')+(a.fuel-al[0].fuel):''));
      if(O('wx')&&a.wx){
        doc.setFont('helvetica','normal');doc.setFontSize(7.8);
        wxDraw(doc,L+doc.getTextWidth(lab)+2.2,y,a.wx.s);
        if((a.wx.s==='warn'||a.wx.s==='bad')&&a.wx.r&&y<top+sh0-12){y+=2.4;gray(60);t(a.wx.r,L+1,y,6,false);gray(0)}
      }
    });
  }
  if(O('wts')){
    sec('WEIGHTS t (max)');
    const e=d.est||{},m=d.max||{};
    [['TOW','tow'],['LW','lw'],['ZFW','zfw']].forEach(([k,f])=>row(k,e[f]!=null&&m[f]!=null?e[f].toFixed(1)+' ('+m[f].toFixed(1)+')':'-'));
  }
  if(O('pax')){y+=3.9;gray(80);t('Pax',L,y,7.8,false);gray(0);ln(L+9,R,y+.5,.2);if(d.pax)t(String(d.pax),L+11,y-.2,11,true)}
  if(O('notes')){
    y+=3.6;gray(64);
    if(d.tank)t(String(d.tank).slice(0,40),L,y,6,false);
    if(d.next){y+=2.6;t('Next '+d.next.fn+' STD '+hm(d.next.std)+'Z',L,y,6,false)}
    if(d.ofp){y+=2.6;t('OFP '+d.ofp,L,y,6,false)}
    gray(0);
  }
}
async function pdfSheet(){
  if(!LAST.length){$('msg').textContent='Load the LIDO PDFs first.';return}
  if(!window.jspdf){$('msg').textContent='PDF library not loaded: reload the page.';return}
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  const g={};LAST.forEach(d=>(g[d.date]=g[d.date]||[]).push(d));
  const strips=[];
  Object.keys(g).sort((a,b)=>dkey(a).localeCompare(dkey(b))).forEach(k=>{
    const L=g[k].sort((a,b)=>((a.off&&a.off.z)||'').localeCompare((b.off&&b.off.z)||''));
    for(let i=0;i<L.length;i+=4)strips.push([L.slice(i,i+4),i]);
  });
  const cw=52.5,sh=148.5;
  for(let i=0;i<strips.length;i+=2){
    if(i)doc.addPage();
    for(let s=0;s<2&&i+s<strips.length;s++){
      const [fl,base]=strips[i+s],top=s*sh;
      for(let j=0;j<4;j++)pdfCol(doc,j*cw,top,cw,fl[j],base+j+1);
      doc.setDrawColor(130);doc.setLineWidth(.15);doc.setLineDashPattern([1,1],0);
      for(let j=1;j<4;j++)doc.line(j*cw,top,j*cw,top+sh);
      doc.setDrawColor(0);doc.setLineDashPattern([],0);
    }
    doc.setDrawColor(130);doc.setLineDashPattern([1,1],0);doc.line(0,sh,210,sh);doc.setDrawColor(0);doc.setLineDashPattern([],0);
  }
  const blob=doc.output('blob');
  $('th').innerHTML='';
  await saveFile(blob,'flight-sheet.pdf');
}

async function load(files,extra){
  if(!files.length)return {out:[],errs:[]};
  if(typeof pdfjsLib==='undefined'){$('msg').textContent='PDF library not loaded: check your connection and reload the page.';return {out:[],errs:['pdf.js missing']}}
  const out=[],errs=[];
  $('msg').textContent='Reading PDFs…';
  for(const f of files){
    try{const d=parse(await readPdf(f));if(!d.cs&&!d.fn)throw new Error('formato non riconosciuto');out.push(d)}
    catch(e){errs.push(f.name+': '+e.message)}
  }
  const ids=new Set(out.map(fid));
  const all=LAST.filter(d=>!ids.has(fid(d))).concat(out);
  all.sort((a,b)=>(dkey(a.date)+((a.off&&a.off.z)||'')).localeCompare(dkey(b.date)+((b.off&&b.off.z)||'')));
  LAST=all;afterChange();
  $('msg').innerHTML=out.length?`<b>${LAST.length} flights ready</b> (saved on this device)<div class="chips">${LAST.map(d=>'<span>'+esc((d.fn||'')+' '+(d.dep||'')+'→'+(d.arr||''))+'</span>').join('')}</div>Always check the data against the original OFP before use. ${errs.length?'<br>Errors: '+esc(errs.join('; ')):''}`:'No flights read. '+esc(errs.join('; '));
  if(extra)$('msg').insertAdjacentHTML('beforeend','<br><span class="sm">'+esc(extra)+'</span>');
  return {out,errs};
}

async function gmApi(tok,path,body,del){
  const r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/'+path,del?{method:'DELETE',headers:{Authorization:'Bearer '+tok}}:body===undefined?{headers:{Authorization:'Bearer '+tok}}:{method:'POST',headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok){let msg='';try{const j=await r.json();msg=(j.error&&j.error.message)||''}catch(e){}throw new Error('Gmail '+r.status+(msg?': '+msg.slice(0,220):'')+(r.status===403?' (check that the Gmail API is enabled in the same Google Cloud project as the client ID)':''))}
  return del?{}:r.json();
}
function gmPdfParts(p,out=[]){if(!p)return out;if(p.body&&p.body.attachmentId&&((p.filename&&/\.pdf$/i.test(p.filename))||/pdf/i.test(p.mimeType||'')))out.push({name:p.filename||'attachment.pdf',id:p.body.attachmentId});(p.parts||[]).forEach(x=>gmPdfParts(x,out));return out}
function gmBytes(b64u){const b=atob(b64u.replace(/-/g,'+').replace(/_/g,'/'));const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function gmFetch(){
  if(!GM.cid){$('msg').textContent='Set your Google OAuth client ID first: Options, Gmail.';$('optbox').parentNode.open=true;return}
  const btn=$('gmBtn');btn.disabled=true;
  try{
    $('msg').textContent='Connecting to Gmail…';
    await gmScript();const tok=await gmToken();
    const prof=await gmApi(tok,'profile');
    const t0=new Date();t0.setHours(0,0,0,0);
    const q=encodeURIComponent((GM.from?'from:'+GM.from+' ':'')+'has:attachment filename:pdf after:'+Math.floor(t0.getTime()/1000));
    const lst=await gmApi(tok,'messages?maxResults=25&q='+q);
    const all=lst.messages||[];
    let seen={};try{seen=JSON.parse(localStorage.getItem('fsmailseen')||'{}');if(Array.isArray(seen))seen={}}catch(e){}
    const have=new Set(LAST.map(fid));
    const todo=all.filter(m=>!(seen[m.id]&&seen[m.id].length&&seen[m.id].every(f=>have.has(f))));
    const who=prof.emailAddress||'?';
    if(!all.length){$('msg').innerHTML='Signed in as <b>'+esc(who)+'</b>: no emails'+(GM.from?' from '+esc(GM.from):'')+' with a PDF today. Only today\'s emails are read. Check that this is the mailbox that receives the OFPs and the sender address (Options, Gmail). Leave Sender empty to search every PDF.';return}
    const act=((GM.act==='trash'||GM.act==='delete')&&!GM.from)?'read':(GM.act||'keep');
    const done=all.filter(m=>todo.indexOf(m)<0).map(m=>m.id);
    let nPdf=0,okF=0;const errs=[];
    if(!todo.length)$('msg').textContent='Signed in as '+who+': '+all.length+' OFP emails today, all already loaded.';
    for(let i=0;i<todo.length;i++){
      $('msg').textContent='Downloading '+(i+1)+' of '+todo.length+'…';
      const m=await gmApi(tok,'messages/'+todo[i].id+'?format=full');
      const files=[];
      for(const p of gmPdfParts(m.payload)){const a=await gmApi(tok,'messages/'+todo[i].id+'/attachments/'+p.id);files.push(new File([gmBytes(a.data)],p.name,{type:'application/pdf'}))}
      nPdf+=files.length;
      if(!files.length)continue;
      const res=await load(files);
      okF+=res.out.length;res.errs.forEach(e=>errs.push(e));
      if(res.out.length&&!res.errs.length){seen[todo[i].id]=res.out.map(fid);done.push(todo[i].id)}
    }
    try{localStorage.setItem('fsmailseen',JSON.stringify(seen))}catch(e){}
    let acted=0,aerr='';
    if(act!=='keep'){
      for(const id of done){
        try{if(act==='delete')await gmApi(tok,'messages/'+id,undefined,true);else if(act==='trash')await gmApi(tok,'messages/'+id+'/trash',{});else await gmApi(tok,'messages/'+id+'/modify',{removeLabelIds:['UNREAD']});acted++}
        catch(e){aerr=e.message;break}
      }
    }
    const sm='Gmail ('+who+'): '+all.length+' emails today, '+nPdf+' PDFs, '+okF+' flights read'+(errs.length?'. Not read: '+errs.join('; '):'')+(act==='keep'?'. Emails left unread.':'. '+acted+' emails '+(act==='delete'?'permanently deleted.':act==='trash'?'moved to Trash.':'marked as read.'))+(aerr?' Could not update emails: '+aerr:'')+((GM.act==='trash'||GM.act==='delete')&&!GM.from?' (Removal skipped: no sender set.)':'');
    $('msg').insertAdjacentHTML('beforeend','<br><span class="sm">'+esc(sm)+'</span>');
  }catch(e){$('msg').textContent='Gmail: '+e.message}
  finally{btn.disabled=false}
}
$('gmBtn').addEventListener('click',gmFetch);
/*ENDGMAIL*/
gmUi();

addEventListener('drop',e=>{e.preventDefault();load([...e.dataTransfer.files].filter(f=>/pdf$/i.test(f.name)))});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
